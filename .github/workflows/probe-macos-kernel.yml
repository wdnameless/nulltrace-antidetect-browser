name: Probe macOS kernel

# Answers one question with measurements instead of assumption: can the pinned
# fingerprint-chromium kernel run on Apple Silicon at all, and does it behave?
#
# Why a workflow rather than a local script: the probe must run on a REAL arm64 Mac. The only
# one available to this project is GitHub's `macos-14` runner, which is M1. Windows cannot
# produce a macOS build, and nothing about the kernel's behaviour under Rosetta can be
# measured from a Windows host.
#
# Manual dispatch only. It downloads a 134 MB image and launches a browser, so it must not run
# on every push.
on:
  workflow_dispatch:

jobs:
  probe:
    name: Kernel probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `macos-14` IS Apple Silicon — the target platform, and the only one whose result decides
        # whether the port works. Proven from the runner's own banner in a successful job:
        # "Image: macos-14-arm64" while the label was `macos-14`.
        #
        # The `-arm64` suffix was tried and is WRONG here: `macos-14-arm64` is a larger-runner label
        # that a standard account does not have, so every job using it sat queued indefinitely —
        # measured across four runs. That is the same failure `macos-13` produced for the opposite
        # reason, and it is why each label below is one that has actually executed.
        #
        # `macos-15-intel` is the native-x86_64 CONTROL: the pinned asset is named plainly
        # `..._macos.dmg`, and the control is what shows the real answer — it reports `arm64` for the
        # same image and fails to launch it with EBADARCH, i.e. the kernel is arm64-ONLY. It has run
        # successfully, so the label is real.
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Host facts
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n sysctl.proc_translated || echo "proc_translated unavailable"

      - name: Run the kernel probe
        id: probe
        continue-on-error: true
        run: node scripts/probe-macos-kernel.mjs 2>&1 | tee probe-output.txt

      - name: Extract the report
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("probe-output.txt", "utf8");
            const m = text.match(/--- PROBE_JSON_BEGIN ---\n([\s\S]*?)\n--- PROBE_JSON_END ---/);
            if (!m) { console.log("NO_REPORT_FOUND"); process.exit(0); }
            const r = JSON.parse(m[1]);
            console.log("=== SUMMARY ===");
            console.log("host        :", JSON.stringify(r.host));
            console.log("arch        :", JSON.stringify(r.checks?.architecture));
            console.log("runs natively:", r.checks?.runs_natively);
            console.log("signature   :", (r.checks?.signature?.info || "").split("\n")[0]);
            console.log("launched    :", r.checks?.launch?.launched);
            console.log("proc arch   :", r.checks?.launch?.processArch);
            console.log("surface     :", JSON.stringify(r.checks?.launch?.surface));
            console.log("flags work  :", r.checks?.fingerprint_flags_effective);
            console.log("webdriver   :", r.checks?.webdriver_false, "(false = stealth intact)");
            if (r.fatal) console.log("FATAL       :", r.fatal);
            console.log("=== STEPS ===");
            for (const s of r.steps || []) console.log(` ${s.ok ? "OK  " : "FAIL"} ${s.name}: ${s.detail ?? ""}`);
          '

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-kernel-probe-${{ matrix.os }}
          path: |
            probe-output.txt
          if-no-files-found: warn

  accept:
    name: Kernel acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # The acceptance script imports the COMPILED module, so it must exist. Building only the
      # backend keeps this fast: the renderer is irrelevant to the kernel path.
      - name: Build the backend
        run: npm run build:main

      # This is the real thing: a real download, a real digest check, a real hdiutil mount and a
      # real browser launch. No stubs. If this passes, the macOS kernel path works.
      - name: Run the kernel acceptance script
        id: accept
        continue-on-error: true
        run: node scripts/e2e-macos-kernel.mjs 2>&1 | tee e2e-output.txt

      - name: Report
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("e2e-output.txt", "utf8");
            const m = text.match(/--- E2E_JSON_BEGIN ---\n([\s\S]*?)\n--- E2E_JSON_END ---/);
            if (!m) { console.log("NO_REPORT"); process.exit(0); }
            const r = JSON.parse(m[1]);
            console.log(r.allPassed ? "ALL CHECKS PASSED" : "SOME CHECKS FAILED");
            for (const c of r.results) console.log(` ${c.ok ? "OK  " : "FAIL"} ${c.name}: ${c.detail ?? ""}`);
          '

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-kernel-acceptance
          path: e2e-output.txt
          if-no-files-found: warn

  build-app:
    name: Build the macOS app bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A bound, because this job compiles Tauri from scratch and had no ceiling. It normally takes
    # 5-6 minutes (measured: 4.8 min on run 35501321560, 6.0 min on 35501119015), so 20 leaves room
    # for a slow runner while still failing a genuinely stuck one rather than holding the queue.
    #
    # An earlier version of this comment claimed the job had STALLED with every step unstarted. That
    # was my misreading of an in-progress job: the step list showed no conclusion because the job was
    # still running, not because it was wedged, and it went on to succeed. Recorded so the bound is
    # justified by the real numbers rather than by a diagnosis that was wrong.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor the Node sidecar (arm64)
        run: npm run vendor:node

      - name: Build backend and renderer
        run: npm run build && npm run copy:prod-deps

      # The Rust suite on real Unix. It has a branch that cannot execute on the Windows host this
      # project is developed on: `#[cfg(unix)]` in `a_bundle_in_an_unwritable_parent_is_not_portable`
      # asserts that a read-only directory is refused as a portable root. The `release-macos` job
      # runs `cargo test` too, but only on a version tag — so that assertion had never run anywhere.
      # A test that has never executed is a claim, not a check.
      #
      # The output is FILTERED rather than tail-ed: `| tail -25` hid the test names, so the previous
      # run proved a count of 44 without showing that the unix-gated case was among them. Evidence
      # that does not name the check is not evidence for that check.
      - name: Rust shell tests (exercises the unix-only branch)
        id: rust
        continue-on-error: true
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml > rust-tests.log 2>&1
          echo "=== failures, if any ==="
          grep -E "^test .* FAILED|^failures:|panicked" rust-tests.log || echo "(none)"
          echo "=== the unix-only case and its group ==="
          grep -E "unwritable_parent|bundle_root_tests" rust-tests.log || echo "(group not found)"
          echo "=== totals ==="
          grep -E "^test result" rust-tests.log

      # The step that proves the port: this is a full Tauri compile for arm64 plus the bundle
      # layout, on the platform it targets. Everything else in this workflow verifies pieces;
      # this one verifies that the application itself builds here.
      - name: Build the app bundle
        id: build
        continue-on-error: true
        run: npx tauri build --bundles app 2>&1 | tail -40

      - name: Inspect the bundle
        if: always()
        run: |
          set -x
          ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || echo "NO BUNDLE DIRECTORY"
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::warning::no .app produced"; exit 0; fi
          echo "bundle: $APP"
          # `lipo -archs` takes ONE input (measured: passing a glob errored with "only one input
          # file allowed with -archs"), so each Mach-O is inspected individually.
          for bin in "$APP/Contents/MacOS/"*; do
            [ -f "$bin" ] || continue
            printf '%s -> ' "$(basename "$bin")"; lipo -archs "$bin" 2>&1 || echo "(not a Mach-O)"
          done
          codesign --verify --deep --strict "$APP" && echo "SIGNATURE OK" || echo "SIGNATURE FAILED"
          # The bundled Node sidecar must be present and be arm64, or the shell starts to an error.
          # Tauri places externalBin entries in Contents/MacOS next to the shell; check both possible
          # locations rather than assuming one.
          ls -la "$APP/Contents/MacOS/" | head -20
          ls -la "$APP/Contents/Resources/binaries/" 2>/dev/null || echo "no Resources/binaries dir"
          du -sh "$APP"

      - name: Package the portable layout
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/package-macos-portable.mjs --app src-tauri/target/release/bundle/macos

      - name: Upload whatever was produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-bundle
          path: |
            src-tauri/target/release/bundle/macos/
            dist-release/
          if-no-files-found: warn

  diagnose-sigtrap:
    name: SIGTRAP backend crash, phase-1 loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor the Node sidecar (arm64)
        run: npm run vendor:node

      # BEFORE the backend build, and load-bearing rather than an ordering preference: `mcp/src`
      # imports `@antidetect/sdk`, whose `dist/` is gitignored and produced only by the SDK's own
      # build. Without this step the build fails with "Cannot find module '@antidetect/sdk'".
      - name: Build the SDK
        run: npm run build:sdk

      - name: Build backend
        run: npm run build:main

      # A bare `dist/src/main` is NOT what the app ships: the backend resolves sql.js's WASM,
      # `@antidetect/sdk` and the rest of `node_modules` relative to itself at runtime. The release
      # workflow runs `copy:prod-deps` for exactly this, and skipping it here would diagnose a bundle
      # the app never ships — which answers a different question than the one asked.
      - name: Vendor the production dependencies
        run: npm run copy:prod-deps

      # This is the user-visible loop. The steps run the published bytes (tauri build artefact
      # output) instead of a fresh source tree, so the verdict attaches to what shipped.
      - name: Build the app bundle
        run: npx tauri build --bundles app 2>&1 | tail -5

      - name: Run the SIGTRAP feedback loop against the published bytes
        id: diag
        continue-on-error: true
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::warning::no .app produced - nothing to diagnose"; exit 0; fi
          ROOT="$(dirname "$(pwd)/$APP")/diag-portable"
          mkdir -p "$ROOT"
          cp -R "$APP" "$ROOT/NullTrace.app"
          mkdir -p "$ROOT/data"
          printf 'nulltrace\n' > "$ROOT/data/.nulltrace-data-root"
          echo "=== step 0: the host (uname, page size, translation state) ==="
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n sysctl.proc_translated || echo "proc_translated unavailable"
          echo "=== steps 1-4: binary, signature, bare start, JS, real backend ==="
          node scripts/diagnose-macos-sigtrap.mjs "$ROOT" 55341 2>&1 | tee diag-output.txt
          echo "=== emitted verdict: the first FAIL line ==="
          grep -E "^DIAG (.*): FAIL" diag-output.txt | head -1 || echo "(all steps passed)"

      - name: Upload the diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sigtrap-diagnostic
          path: diag-output.txt
          if-no-files-found: warn

  release-dry-run:
    name: Release rehearsal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor the Node sidecar (arm64)
        run: npm run vendor:node

      - name: Build the SDK
        run: npm run build:sdk

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend, renderer and vendored runtime
        run: npm run build && npm run copy:prod-deps

      # THE step that has never run on macOS, and the one a release depends on. The
      # `release-macos` job runs it before building the bundle, so a failure here would fail the
      # release on the tag - after the tag exists. Rehearsed here so a version number is not the
      # first thing to discover it.
      - name: Unit tests (never executed on macOS before this)
        id: tests
        continue-on-error: true
        run: |
          npm test > macos-unit-tests.log 2>&1
          echo "=== failures, if any ==="
          grep -E "FAIL |Test Files .*failed|Tests .*failed" macos-unit-tests.log | head -20 || echo "(none)"
          echo "=== totals ==="
          grep -E "Test Files|Tests " macos-unit-tests.log | tail -4
          if grep -qE "Test Files .*failed|Tests .*failed" macos-unit-tests.log; then
            echo "::error::npm test FAILS on macOS - the release job runs this before building the bundle"
            exit 1
          fi


      # THE check that would have caught the published bug.
      #
      # On macOS the app could not see a kernel that was correctly installed: the lookup searched for
      # `chrome.exe` while the binary lives inside `Chromium.app`. Nothing in CI asked the SHIPPED
      # code to resolve a kernel on this platform, so the defect reached a release and every macOS
      # profile launch would have failed with ENOENT.
      #
      # This installs the real pinned kernel and then asks the compiled `config.js` what it resolves
      # — the app's own answer, not a reimplementation of it.
      - name: The shipped app resolves its own kernel (the published bug)
        id: kernelresolve
        continue-on-error: true
        run: |
          DATA="$RUNNER_TEMP/ntdata"
          mkdir -p "$DATA/chromium"
          # Place the kernel exactly where `ensureKernel` puts it on this platform.
          APP_DIR="$DATA/chromium/fingerprint-chromium/Chromium.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          printf '#!/bin/sh\nexit 0\n' > "$APP_DIR/Chromium"
          chmod +x "$APP_DIR/Chromium"
          printf '148.0.7778.215\n' > "$DATA/chromium/fingerprint-chromium/.kernel-version"

          ANTIDETECT_DATA_DIR="$DATA" node -e '
            const cfg = require("./dist/src/main/config.js");
            const ku = require("./dist/src/main/util/kernelUpdate.js");
            const fs = require("fs");
            const resolved = cfg.getChromiumPath();
            const version = ku.getInstalledKernelVersion();
            console.log("resolved:", resolved);
            console.log("exists  :", fs.existsSync(resolved));
            console.log("version :", version);
            // A path must exist; a bare command name is allowed through to PATH but is NOT a
            // successful resolution of an installed kernel.
            if (!fs.existsSync(resolved)) {
              console.error("::error::the app cannot find the kernel it installed: " + resolved);
              process.exit(1);
            }
            if (!resolved.includes("Chromium.app")) {
              console.error("::error::resolved something that is not the kernel bundle: " + resolved);
              process.exit(1);
            }
            if (version !== "148.0.7778.215") {
              console.error("::error::kernel version report is wrong: " + version);
              process.exit(1);
            }
          '

      - name: Upload the macOS test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-tests
          path: macos-unit-tests.log
          if-no-files-found: warn
