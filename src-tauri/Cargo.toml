[package]
name = "nulltrace-tauri-shell"
version = "0.6.58"
description = "NullTrace thin desktop shell over served web interface"
authors = ["NullTrace Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
urlencoding = "2.1"
url = "2.5"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0"
ed25519-dalek = { version = "2.1", features = ["std", "pem"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
aes-gcm = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# Verification-only: proves a release signature actually matches the published key.
# Not linked into the shipped binary.
[dev-dependencies]
minisign-verify = "0.2"
