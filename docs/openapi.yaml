            - type: array
              items:
                type: string
        to_addrs:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        cc:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        bcc:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        subject:
          type: string
        text:
          type: string
        bodyText:
          type: string
        body_text:
          type: string
        html:
          type: string
        bodyHtml:
          type: string
        body_html:
          type: string
        inReplyTo:
          type: string
        in_reply_to:
          type: string
